[project]
name = "basketball-da"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py314"
src = ["code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
